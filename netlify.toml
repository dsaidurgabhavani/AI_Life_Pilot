[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Optional: If you deploy your backend on Render/Railway, uncomment and set your backend URL below:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# Single Page Application (SPA) rule: redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
